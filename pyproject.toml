[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lv-chordia"
dynamic = ["version"]
description = "Large-Vocabulary Chord Transcription via Chord Structure Decomposition - ISMIR 2019"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Junyan Jiang"},
    {name = "Ke Chen"},
    {name = "Wei Li"},
    {name = "Gus Xia"}
]
maintainers = [
    {name = "Package Maintainers"}
]
keywords = [
    "music",
    "chord",
    "recognition",
    "transcription",
    "audio",
    "mir",
    "music-information-retrieval",
    "chord-recognition",
    "deep-learning",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Bumped from >=3.8 (see CHANGELOG): torch>=2.13.0 itself only ships
# cp310+ wheels, so >=3.8 became factually false the moment the mandated
# torch floor bump landed -- this is a forced consequence of the floor
# refresh, not an independent scope decision.
requires-python = ">=3.10"
dependencies = [
    "torch>=2.13.0",
    "pretty_midi>=0.2.9",
    "h5py>=3.16.0",
    "pydub>=0.23.1",
    "joblib>=1.5.3",
    "librosa>=0.11.0",
    # numpy>=2.3 requires Python>=3.11 and numpy>=2.5 requires Python>=3.12;
    # 2.2.6 is the newest 2.x release that still supports the Python 3.10
    # floor this repo's CI matrix covers (org constitution article 3).
    "numpy>=2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=22.0",
    "flake8>=4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/music-x-lab/ISMIR2019-Large-Vocabulary-Chord-Recognition"
Repository = "https://github.com/music-x-lab/ISMIR2019-Large-Vocabulary-Chord-Recognition"
"Original Research" = "https://archives.ismir.net/ismir2019/paper/000078.pdf"
"Bug Reports" = "https://github.com/music-x-lab/ISMIR2019-Large-Vocabulary-Chord-Recognition/issues"
Documentation = "https://github.com/music-x-lab/ISMIR2019-Large-Vocabulary-Chord-Recognition#readme"

[project.scripts]
lv-chordia = "lv_chordia.cli:main"

[tool.hatch.version]
path = "lv_chordia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["lv_chordia"]
shared-data = { "cache_data" = "share/lv-chordia/cache_data" }
include = [
    "lv_chordia/data/*",
]

[tool.hatch.build.targets.sdist]
include = [
    "lv_chordia/**/*.py",
    "lv_chordia/data/*",
    "cache_data/*.sdict",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/MANIFEST.in",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
